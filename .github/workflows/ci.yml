name: E-commerce UI Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
        python-version: ['3.11', '3.12']

    name: Test on ${{ matrix.browser }} with Python ${{ matrix.python-version }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Clean up processes and cache
      run: |
        pkill -f firefox || true
        pkill -f chrome || true
        pkill -f geckodriver || true
        pkill -f chromedriver || true
        pkill -f "Xvfb" || true
        rm -rf ~/.wdm ~/.cache/selenium /tmp/.wdm
        sleep 2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb dbus-x11
        sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libxt6 libxcomposite1
        sudo apt-get install -y libasound2t64 libpangocairo-1.0-0 libatk1.0-0
        sudo apt-get install -y libcairo-gobject2 libgtk-3-0 libgdk-pixbuf2.0-0

    - name: Install Chrome
      if: matrix.browser == 'chrome'
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Firefox (Non-Snap)
      if: matrix.browser == 'firefox'
      run: |
        sudo apt-get remove -y firefox firefox-esr || true
        sudo apt-get autoremove -y || true
        sudo apt-get install -y firefox
        firefox --version
        mkdir -p ~/.mozilla/firefox
        chmod 755 ~/.mozilla/firefox
        echo "MOZ_HEADLESS=1" >> $GITHUB_ENV
        echo "MOZ_DISABLE_CONTENT_SANDBOX=1" >> $GITHUB_ENV
        echo "MOZ_CRASHREPORTER_DISABLE=1" >> $GITHUB_ENV

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify pyyaml installed
      run: |
        python -c "import yaml; print('PyYAML version:', yaml.__version__)"

    - name: Create directories for reports
      run: mkdir -p reports screenshots allure-results

    - name: Run tests with pytest
      env:
        BROWSER: ${{ matrix.browser }}
        HEADLESS: true
        DISPLAY: :99
        MOZ_HEADLESS: 1
        MOZ_DISABLE_CONTENT_SANDBOX: 1
        MOZ_CRASHREPORTER_DISABLE: 1
      run: |
        Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp -dpi 96 &
        sleep 5
        ps aux | grep Xvfb

        if [ "${{ matrix.browser }}" = "firefox" ]; then
          xvfb-run -a -s "-screen 0 1920x1080x24 -ac -nolisten tcp -dpi 96" \
            pytest tests/ \
              --browser=${{ matrix.browser }} \
              --headless \
              --junit-xml=reports/junit-report-${{ matrix.browser }}-py${{ matrix.python-version }}.xml \
              --html=reports/test-report-${{ matrix.browser }}-py${{ matrix.python-version }}.html \
              --self-contained-html \
              --json-report \
              --json-report-file=reports/json-report-${{ matrix.browser }}-py${{ matrix.python-version }}.json \
              --alluredir=allure-results \
              --cov=pages --cov=utilities \
              --cov-report=xml:reports/coverage-${{ matrix.browser }}-py${{ matrix.python-version }}.xml \
              --cov-report=html:reports/coverage-html-${{ matrix.browser }}-py${{ matrix.python-version }} \
              -v
        else
          pytest tests/ \
            --browser=${{ matrix.browser }} \
            --headless \
            --junit-xml=reports/junit-report-${{ matrix.browser }}-py${{ matrix.python-version }}.xml \
            --html=reports/test-report-${{ matrix.browser }}-py${{ matrix.python-version }}.html \
            --self-contained-html \
            --json-report \
            --json-report-file=reports/json-report-${{ matrix.browser }}-py${{ matrix.python-version }}.json \
            --alluredir=allure-results \
            --cov=pages --cov=utilities \
            --cov-report=xml:reports/coverage-${{ matrix.browser }}-py${{ matrix.python-version }}.xml \
            --cov-report=html:reports/coverage-html-${{ matrix.browser }}-py${{ matrix.python-version }} \
            -v
        fi

    - name: Generate Allure Report
      if: always()
      run: |
        wget -q https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure
        allure generate allure-results --clean -o reports/allure-report-${{ matrix.browser }}-py${{ matrix.python-version }} || true

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.browser }}-py${{ matrix.python-version }}
        path: |
          reports/
          screenshots/
        retention-days: 30

  test-summary:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Generate aggregated summary
      run: |
        python -c "
        import json, glob
        all_results = []
        for json_file in glob.glob('artifacts/*/reports/*json-report*.json'):
            try:
                with open(json_file, 'r') as f:
                    data = json.load(f)
                    browser = json_file.split('json-report-')[1].split('-py')[0]
                    python_ver = json_file.split('-py')[1].split('.json')[0]
                    data['browser'] = browser
                    data['python_version'] = python_ver
                    all_results.append(data)
            except Exception as e:
                print(f'Error: {e}')
        total = sum(r.get('summary', {}).get('total', 0) for r in all_results)
        passed = sum(r.get('summary', {}).get('passed', 0) for r in all_results)
        failed = sum(r.get('summary', {}).get('failed', 0) for r in all_results)
        pass_rate = (passed / total * 100) if total > 0 else 0
        print(f'Total: {total}, Passed: {passed}, Failed: {failed}, Pass Rate: {pass_rate:.2f}%')
        "
    - name: Upload summary
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-execution-summary
        path: test-summary.json
        retention-days: 30

  performance-check:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
    - uses: actions/checkout@v4
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: Performance Analysis
      run: |
        python -c "
        import json, glob
        data = []
        for json_file in glob.glob('artifacts/*/reports/*json-report*.json'):
            try:
                with open(json_file, 'r') as f:
                    d = json.load(f)
                    browser = json_file.split('json-report-')[1].split('-py')[0]
                    total_duration = d.get('duration', 0)
                    test_count = d.get('summary', {}).get('total', 0)
                    if test_count > 0:
                        data.append({
                            'browser': browser,
                            'total_duration': round(total_duration, 2),
                            'test_count': test_count,
                            'avg_test_time': round(total_duration / test_count, 2)
                        })
            except Exception as e:
                print(f'Error: {e}')
        for p in data:
            print(f'{p[\"browser\"].upper()}: {p[\"total_duration\"]}s total, {p[\"avg_test_time\"]}s avg/test')
        "