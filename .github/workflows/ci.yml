name: E-commerce UI Automation CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Clean up processes and cache
      run: |
        pkill -f firefox || true
        pkill -f chrome || true
        pkill -f geckodriver || true
        pkill -f chromedriver || true
        pkill -f "Xvfb" || true
        rm -rf ~/.wdm ~/.cache/selenium /tmp/.wdm
        sleep 2

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wget unzip xvfb dbus-x11
        sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libxt6 libxcomposite1
        sudo apt-get install -y libasound2t64 libpangocairo-1.0-0 libatk1.0-0 || sudo apt-get install -y libasound2 libpangocairo-1.0-0 libatk1.0-0 || true
        sudo apt-get install -y libcairo-gobject2 libgdk-pixbuf2.0-0
        sudo apt-get install -y libx11-xcb1 libxtst6 libnss3 libxss1

    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo 'deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main' | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Firefox (Mozilla PPA, non-snap)
      run: |
        sudo apt-get remove -y firefox firefox-esr || true
        sudo apt-get autoremove -y || true
        sudo add-apt-repository -y ppa:mozillateam/ppa
        printf 'Package: *\nPin: release o=LP-PPA-mozillateam\nPin-Priority: 1001\n' | sudo tee /etc/apt/preferences.d/mozilla-firefox
        sudo apt-get update
        sudo apt-get install -y firefox
        firefox --version

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies (3.11)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create report directories
      run: mkdir -p reports screenshots allure-results

    - name: Start Xvfb
      run: |
        Xvfb :99 -ac -screen 0 1920x1080x24 -nolisten tcp -dpi 96 &
        sleep 5

    - name: Run Chrome tests - Python 3.11
      env:
        DISPLAY: :99
      run: |
        pytest tests/ --browser=chrome --headless -v \
          --ignore=tests/test_network_conditions.py \
          --html=reports/report-chrome-py3.11.html --self-contained-html

    - name: Run Firefox tests - Python 3.11
      env:
        DISPLAY: :99
        MOZ_HEADLESS: 1
        MOZ_DISABLE_CONTENT_SANDBOX: 1
        MOZ_CRASHREPORTER_DISABLE: 1
      run: |
        pytest tests/ --browser=firefox --headless -v \
          --ignore=tests/test_network_conditions.py \
          --html=reports/report-firefox-py3.11.html --self-contained-html

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python dependencies (3.12)
      run: |
        pip install -r requirements.txt

    - name: Run Chrome tests - Python 3.12
      env:
        DISPLAY: :99
      run: |
        pytest tests/ --browser=chrome --headless -v \
          --ignore=tests/test_network_conditions.py \
          --html=reports/report-chrome-py3.12.html --self-contained-html

    - name: Run Firefox tests - Python 3.12
      env:
        DISPLAY: :99
        MOZ_HEADLESS: 1
        MOZ_DISABLE_CONTENT_SANDBOX: 1
        MOZ_CRASHREPORTER_DISABLE: 1
      run: |
        pytest tests/ --browser=firefox --headless -v \
          --ignore=tests/test_network_conditions.py \
          --html=reports/report-firefox-py3.12.html --self-contained-html

    - name: Run Network Condition Tests (Chrome + CDP)
      env:
        DISPLAY: :99
      run: |
        pytest tests/test_network_conditions.py --browser=chrome --headless -v \
          --html=reports/report-network-conditions.html --self-contained-html

    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports
        path: |
          reports/
          screenshots/
        retention-days: 30